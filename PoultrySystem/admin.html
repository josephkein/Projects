<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="shortcut icon" href="./images/eggIcon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Eggonomics</title>
</head>
<body style="background-color: #F8F8F8;">
    <div class="admin">
        <div class="titleLog">
            <img src="images/eggIcon.png" alt="">
            Eggonomics
        </div>
        <form id="loginForm">
            <div class="intro">
                <div class="introTitle">Welcome back!</div>
                <span>Log in to continue</span>
            </div>
            <div class="inputs">
                <input type="text" name="" id="username" placeholder="Username" required>
                <input type="password" name="" id="password" placeholder="Password" required>
                <div class="check">
                    <input type="checkbox" name="showpass" id="showpass" onclick="showPass()">Show password
                </div>
            </div>

            <button type="submit" id="log">Log in</button>
        </form>
    </div>


    <script>
        // LOG IN
    const logIn = document.getElementById("loginForm");

    logIn.addEventListener('submit', (e) => {
        e.preventDefault();

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username == "admin123" && password == "1324"){
            Swal.fire({
                title: "Success!",
                text: "Log in successfully",
                icon: "success",
                confirmButtonText: "OK"
            }).then((result) => {
                if (result.isConfirmed){
                    window.location.href = "./logIn/index.html";
                }
            })
        }
        else if(username != "admin123" || password != "1324"){
            Swal.fire({
                icon: "error",
                title: "Incorrect!",
                text: "Incorrect username or password",
            });
        }
        else{
            Swal.fire({
                icon: "error",
                title: "Invalid!",
                text: "Please input something.",
            });
        }
    })

    function showPass(){
        let checkBox = document.getElementById("showpass");

        if (checkBox.checked){
            document.getElementById("password").type = "text";
        }
        else{
            document.getElementById("password").type = "password";
        }
    }
    </script>
</body>
</html>
